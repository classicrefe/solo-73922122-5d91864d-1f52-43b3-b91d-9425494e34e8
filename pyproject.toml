[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Core correctness + imports + modern syntax + bugbear/simplify.
select = ["E", "F", "I", "UP", "B", "SIM"]
# FastAPI's Depends()/Body()/File() in argument defaults is the documented idiom.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM", "E501"]
"scripts/*" = ["SIM115"]
